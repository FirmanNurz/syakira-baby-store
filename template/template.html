<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans bg-gray-100">
    <header class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Fashion Store</h1>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="#" class="text-gray-600 hover:text-black">Beranda</a></li>
                <li><a href="#" class="text-gray-600 hover:text-black">Produk</a></li>
                <li><a href="#" class="text-gray-600 hover:text-black">Tentang</a></li>
                <li><a href="#" class="text-gray-600 hover:text-black">Kontak</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="text-center py-16 bg-gray-200">
        <h2 class="text-3xl font-semibold">Koleksi Terbaru</h2>
        <p class="text-gray-600 mt-2">Temukan gaya terbaik untukmu</p>
        <button class="mt-4 px-6 py-2 bg-black text-white rounded">Lihat Koleksi</button>
    </section>
    
    <section class="py-16 px-4">
        <h2 class="text-center text-2xl font-semibold mb-6">Produk Unggulan</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 shadow rounded">
                <img src="https://via.placeholder.com/150" alt="Produk 1" class="w-full">
                <h3 class="mt-2 text-lg font-semibold">Produk 1</h3>
                <p class="text-gray-500">Rp 250.000</p>
            </div>
        </div>
    </section>
    
    <footer class="bg-gray-800 text-white text-center p-4 mt-8">
        <p>&copy; 2025 Fashion Store. All rights reserved.</p>
    </footer>
</body>
</html>
